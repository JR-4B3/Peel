# What the Level 2 repack removes from Waydroid's stock images and which Android properties
# it sets. Paths are relative to the root of system.img or vendor.img. A path that no longer
# exists in a newer image is skipped, not an error. Changing this file changes the release ID.

[remove-system]
# Apps that nothing in the playback path uses.
system/product/app/LatinIME
system/product/app/Gallery2
system/product/app/Aperture
system/product/app/ApertureLensLauncher
system/product/app/DeskClock
system/product/app/Etar
system/product/app/Jelly
system/product/app/Backgrounds
system/product/app/Recorder
system/product/app/ExactCalculator
system/product/app/PhotoTable
system/product/app/LocalContactsBackup
system/product/priv-app/Contacts
system/product/priv-app/Eleven
system/system_ext/priv-app/ThemePicker
system/system_ext/priv-app/Seedvault
system/system_ext/priv-app/EmergencyInfo
system/system_ext/priv-app/StorageManager
system/system_ext/priv-app/WaydroidUpdater
system/app/EasterEgg
system/app/BasicDreams
system/app/NfcNci
system/app/HTMLViewer
system/app/BookmarkProvider
system/app/PrintRecommendationService
system/app/CameraExtensionsProxy
system/priv-app/LiveWallpapersPicker
system/priv-app/BuiltInPrintService
system/priv-app/ManagedProvisioning
system/priv-app/MtpService

[remove-vendor]
# The 32-bit graphics stack. No 32-bit app can start once the 32-bit zygote is off, and the
# remaining 32-bit services (audio, camera, CAS, OMX) don't load it.
lib/libLLVM22.so
lib/libgallium_dri.so
lib/dri_gbm.so
lib/egl
lib/hw/vulkan.pastel.so
lib/hw/vulkan.intel.so
lib/hw/vulkan.intel_hasvk.so
lib/hw/vulkan.radeon.so
lib/hw/vulkan.lvp.so
lib/hw/vulkan.virtio.so

[properties]
# The display is invisible, and Android only reports booted once the boot animation has played
# to its end, about 5 seconds after the screen is ready.
debug.sf.nobootanimation=1
# Only the 64-bit zygote: Apple Music ships x86_64 code. Setting any ABI list stops Android from
# deriving the others, so all three are set for every partition (the zygote aborts without
# abilist64).
ro.zygote=zygote64
ro.product.cpu.abilist=x86_64
ro.product.cpu.abilist32=
ro.product.cpu.abilist64=x86_64
ro.system.product.cpu.abilist=x86_64
ro.system.product.cpu.abilist32=
ro.system.product.cpu.abilist64=x86_64
ro.vendor.product.cpu.abilist=x86_64
ro.vendor.product.cpu.abilist32=
ro.vendor.product.cpu.abilist64=x86_64
# Apple Music refuses to start on a debug build. The build fingerprints are derived from the
# image at repack time and added to the release's properties.
ro.build.type=user
ro.build.tags=release-keys
ro.system.build.type=user
ro.system.build.tags=release-keys
ro.vendor.build.type=user
ro.vendor.build.tags=release-keys
ro.product.build.type=user
ro.product.build.tags=release-keys
ro.system_ext.build.type=user
ro.system_ext.build.tags=release-keys

[build]
# EROFS compression for both images. zstd at level 15 makes the release 796 MB instead of
# 1,055 MB with lz4hc at level 12, and boots as fast. The kernel needs CONFIG_EROFS_FS_ZIP_ZSTD.
compression = zstd,15
