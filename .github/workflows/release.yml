# Pushing a tag such as v0.2.0 tests that commit on every system and publishes it as the stable
# release. The tag must match package.json's version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: package
        run: bun scripts/package.ts --channel stable --out dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Peel $VERSION" --generate-notes
