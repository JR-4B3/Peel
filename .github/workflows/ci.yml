# Type check and tests on Linux, macOS, and Windows. GitHub's standard runners are free for public
# repositories. The nightly and release workflows run this first and publish only when it passes.
name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "mobile/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "mobile/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
