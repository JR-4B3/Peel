# Each night that main has new commits, test it on every system and publish it as the nightly
# release. Peel installs set to the nightly channel pick it up on their next update check.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: nightly

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        # A night without new commits on main publishes nothing. Starting it by hand always builds.
        run: |
          built=$(git ls-remote origin refs/tags/nightly | cut -f1)
          if [ "$built" = "$GITHUB_SHA" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then build=false; else build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [changes, test]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: package
        run: bun scripts/package.ts --channel nightly --out dist
      # The nightly release is replaced each time, so the nightly tag moves to this commit.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release delete nightly --yes || true
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          gh release create nightly dist/* --prerelease --verify-tag --title "Nightly $VERSION" \
            --notes "Built from $GITHUB_SHA on $(date -u +%Y-%m-%d). Peel installs set to the nightly channel update to it. Nightly builds have the newest features and can break."
